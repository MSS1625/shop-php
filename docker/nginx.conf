# دیجی‌شاپ — نقش web: فایل‌های استاتیک از خود کانتینر، PHP به سرویس app:9000
# (در آلپاین، فایل‌های include سرورها از /etc/nginx/http.d خوانده می‌شوند)

server {
    listen 80;
    server_name _;
    root /var/www/public;
    index index.php;

    charset utf-8;

    # حد آپلود تصویر محصول
    client_max_body_size 20M;

    # فایل‌های استاتیک مستقیم از خود کانتینر وب — بدون عبور از php-fpm
    location ~* \.(css|js|jpe?g|png|gif|webp|svg|ico|woff2?|ttf)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;
    }

    # هیچ فایل مخفی‌ای (.env، .git و…) سرو نمی‌شود
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
