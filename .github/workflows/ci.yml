name: CI

# اجرای خودکار روی هر push (همه شاخه‌ها) و هر Pull Request
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, master]

jobs:
  tests:
    name: PHP ${{ matrix.php }} — Tests
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        php: [8.2, 8.3, 8.4]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, intl, iconv, fileinfo, gd
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --no-scripts

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Run test suite
        run: php artisan test

  code-style:
    name: Code Style (Pint)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          extensions: dom, curl, libxml, mbstring, zip, fileinfo
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-pint-${{ hashFiles('composer.lock') }}
          restore-keys: composer-pint-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --no-scripts

      - name: Check code style
        run: vendor/bin/pint --test

  static-analysis:
    name: Static Analysis (Larastan)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          extensions: dom, curl, libxml, mbstring, zip, fileinfo
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-larastan-${{ hashFiles('composer.lock') }}
          restore-keys: composer-larastan-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --no-scripts

      - name: Run Larastan (PHPStan level 5)
        run: vendor/bin/phpstan analyse --memory-limit=1G

  coverage:
    name: Coverage + Badge
    runs-on: ubuntu-24.04

    # فقط پوش به main — بج از داخل PRها آپدیت نمی‌شود
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, intl, iconv, fileinfo, gd
          coverage: pcov

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-coverage-${{ hashFiles('composer.lock') }}
          restore-keys: composer-coverage-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --no-scripts

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Run test suite with coverage
        run: vendor/bin/phpunit --coverage-clover=clover.xml

      # درصد پوشش → JSON قالب endpoint بج shields.io
      - name: Generate coverage badge
        run: php scripts/coverage-badge.php clover.xml coverage.json

      # بج روی شاخهٔ coverage-badge پوش می‌شود — README از همان‌جا می‌خواند
      - name: Publish badge
        run: |
          DIR="$(mktemp -d)"
          cd "$DIR"
          git init -q
          git checkout -q -b coverage-badge
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp "$GITHUB_WORKSPACE/coverage.json" .
          git add coverage.json
          git commit -qm "coverage: update badge"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" coverage-badge

  # ─────────────────────────────────────────────
  # ایمیج داکر: بیلد + بوت کامل استک (app + web + db) + اسموک‌تست
  # ─────────────────────────────────────────────
  docker:
    name: Docker — build & boot the full stack
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # ۱) ایمیج production ساخته می‌شود (مرحلهٔ composer + runtime)
      - name: Build the production image
        run: docker build -t digishop:ci .

      # ۲) کل فروشگاه با compose بالا می‌آید؛ --wait یعنی منتظر
      #    healthcheckهای همهٔ سرویس‌ها (db سالم، fpm بالا، صفحهٔ اول پاسخ)
      - name: Boot app + web + db
        run: docker compose up -d --wait --wait-timeout 300

      # ۳) صفحهٔ اول واقعاً رندر شده باشد: عنوان فروشگاه + محصول seed شده
      - name: Smoke-test the storefront
        run: |
          body="$(curl -fsS http://localhost:8080/)"
          echo "$body" | grep -q 'دیجی‌شاپ'
          echo "$body" | grep -q 'مودم'
          echo "storefront OK — title + seeded product found"

      # ۴) کل تست‌ها داخل کانتینر (target dev، SQLite درون‌حافظه)
      - name: Run the test suite inside a container
        run: docker compose run --rm test

      # ۵) فایل compose پروداکشن هم همیشه معتبر بماند — بدون دامنهٔ
      #    واقعی، فقط ساختار و interpolation با مقادیر نمونه چک می‌شود
      - name: Validate the production compose file
        run: >-
          DIGISHOP_DOMAIN=ci-example.com
          DB_PASSWORD=ci-secret DB_ROOT_PASSWORD=ci-root-secret
          docker compose -f docker-compose.prod.yml config --quiet

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans
